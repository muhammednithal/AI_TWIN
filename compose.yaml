services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_twin
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - twin_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d ai_twin"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build: ./backend
    command: ["-migrate"]
    environment: &api-environment
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://twin:${POSTGRES_PASSWORD}@db:5432/ai_twin?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/ready"]
      interval: 20s
      timeout: 3s
      retries: 3
  web:
    build: ./ai-twin-frontend
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  twin_data:
